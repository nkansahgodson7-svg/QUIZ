<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f5f0" />
    <meta
      name="description"
      content="Quizzly — a live classroom quiz. Host a room or join with a code."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Quizzly" />
    <title>Quizzly</title>
    <style>
      /* Boot splash — inline so it paints before the app bundle arrives. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: grid;
        place-items: center;
        background: #f6f5f0;
        transition: opacity 220ms ease;
      }

      #boot-splash.is-done {
        opacity: 0;
        pointer-events: none;
      }

      .boot-splash__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        animation: boot-in 260ms ease-out both;
      }

      .boot-splash__mark {
        display: grid;
        place-items: center;
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: #141413;
        color: #f6f5f0;
        font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI',
          Roboto, sans-serif;
        font-size: 26px;
        font-weight: 800;
        line-height: 1;
        animation: boot-ring 1.8s ease-out infinite;
      }

      .boot-splash__word {
        font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI',
          Roboto, sans-serif;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -0.01em;
        color: #141413;
      }

      .boot-splash__dots {
        display: inline-flex;
        gap: 6px;
      }

      .boot-splash__dots i {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: #1d4ed8;
        opacity: 0.25;
        animation: boot-dot 1.1s ease-in-out infinite;
      }

      .boot-splash__dots i:nth-child(2) {
        animation-delay: 0.15s;
      }

      .boot-splash__dots i:nth-child(3) {
        animation-delay: 0.3s;
      }

      @keyframes boot-ring {
        0% {
          box-shadow: 0 0 0 0 rgb(29 78 216 / 0.35);
        }
        70%,
        100% {
          box-shadow: 0 0 0 14px rgb(29 78 216 / 0);
        }
      }

      @keyframes boot-dot {
        0%,
        100% {
          opacity: 0.25;
          transform: scale(0.85);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes boot-in {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-splash {
          transition: none;
        }
        .boot-splash__inner,
        .boot-splash__mark,
        .boot-splash__dots i {
          animation: none;
        }
        .boot-splash__dots i {
          opacity: 0.6;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash" role="status" aria-label="Loading Quizzly">
      <div class="boot-splash__inner">
        <span class="boot-splash__mark" aria-hidden="true">Q</span>
        <span class="boot-splash__word" aria-hidden="true">Quizzly</span>
        <span class="boot-splash__dots" aria-hidden="true"><i></i><i></i><i></i></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
